# Continuous integration (docs/REDESIGN.md §4.8, issue #6).
#
#   linux    the whole solution (the host without shaders), the tests in Debug and Development on the .NET 8 runtime
#            the projects target, the docs checked against the registry dump (every name the host registered,
#            written by -dump-registry) with the real test count, each game's content through `sage validate`,
#            the committed JSON Schemas against a fresh `sage schema`, and the real executable run for a few
#            seconds on each game under Xvfb (tools/smoke_run.sh); then the SDK, the Player and the templates
#            packed into a local feed and a game made from each template outside the checkout: built against
#            the packages alone, validated, and run with `dotnet run` under Xvfb (issue #32)
#            Both jobs' builds check each engine assembly's declared public API (PublicAPI.*.txt, issue #31).
#   windows  the whole solution in all three configurations, shaders included, and the tests; then the
#            packed templates build a game with a shader of its own, which is where mgfxc runs
#
# Only Windows compiles shaders, because mgfxc needs Wine on Linux (MGFXC0001).
# The .NET 10 SDK builds; the .NET 8 runtime runs. Both matter: the 8.0.1xx SDK's compiler produced
# code the runtime rejected (InvalidProgramException in Assert.Fail), and only the .NET 8 runtime
# showed that every save was failing (SaveSystem's JsonSerializerOptions had no TypeInfoResolver).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux · tests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history and its tags: the engine's version comes from them (MinVer, build/Sage.Version.props,
      # issue #31), and a shallow clone would version every build 0.1.0-alpha.0.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The host is compiled without its shaders (SageSkipShaders): mgfxc needs Wine on Linux, and
      # the Windows job builds the real thing.
      - name: Build the solution (Debug, Development, Shipping; host without shaders)
        run: |
          set -euo pipefail
          for config in Debug Development Shipping; do
            echo "::group::$config"
            dotnet build Sage.sln -c "$config" -p:SageSkipShaders=true
            echo "::endgroup::"
          done

      # Not Shipping: it compiles out what some tests assert (README, "Building and testing").
      - name: Test (Debug)
        run: dotnet test tests/Sage.Tests/Sage.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=Debug.trx" --results-directory TestResults

      - name: Test (Development)
        run: dotnet test tests/Sage.Tests/Sage.Tests.csproj -c Development --no-build --logger "trx;LogFileName=Development.trx" --results-directory TestResults

      # Public API discipline (issue #31): the engine assemblies games and kits compile against declare their
      # public API in PublicAPI.Shipped.txt / Unshipped.txt, and the build above (every configuration, here
      # and on Windows) fails when code and files disagree. This shows it: a public type added to Sage.Core
      # without declaring it must be RS0016. (docs/RELEASING.md says how to update the files.)
      - name: An undeclared public API change is a build error (RS0016)
        run: |
          set -euo pipefail
          probe=src/Sage.Core/UndeclaredApiProbe.cs
          echo 'namespace Sage.Core; public sealed class UndeclaredApiProbe { public void Probe() { } }' > "$probe"
          if dotnet build src/Sage.Core/Sage.Core.csproj -c Debug --no-dependencies -p:SageSkipShaders=true > "$RUNNER_TEMP/rs0016.log" 2>&1; then
            rm "$probe"; echo "::error::a public type added without PublicAPI.Unshipped.txt built: the public API analyzer did not run"; exit 1
          fi
          rm "$probe"
          grep -q "error RS0016" "$RUNNER_TEMP/rs0016.log" || { cat "$RUNNER_TEMP/rs0016.log"; exit 1; }
          dotnet build src/Sage.Core/Sage.Core.csproj -c Debug --no-dependencies -p:SageSkipShaders=true > /dev/null

      # A virtual display, for the two steps that run the real executable.
      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      # Every command, cvar, record type, component, part, system, entity input/output and action the
      # Sandbox registers, with owners and fields (RegistryDump, issue #18). The host boots, writes it and
      # quits; check_docs.py reads names and counts from it instead of scanning the source.
      - name: Dump the registry (Development host, Xvfb)
        run: |
          set -euo pipefail
          ( cd src/Sage.Host/bin/Development/net8.0 && timeout 120 xvfb-run -a -s "-screen 0 1024x768x24" \
              ./Sage.Host -game "$GITHUB_WORKSPACE/games/Sandbox" -dump-registry "$GITHUB_WORKSPACE/user/registry.json" > /dev/null )
          test -s user/registry.json

      - name: Check the docs against the code (R19)
        run: |
          set -euo pipefail
          count=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
          counters = ET.parse("TestResults/Debug.trx").getroot().find(f".//{ns}Counters")
          print(counters.get("total"))
          EOF
          )
          echo "dotnet test reported $count tests"
          python3 tools/check_docs.py --self-test
          python3 tools/check_docs.py --tests "$count" --registry user/registry.json

      # `sage validate` (issue #22): each game's content, headless, with every check the load makes —
      # references by type, prefab bodies, asset paths, AI schedules — and missing assets as errors.
      # Fails on any error; warnings (the test games' engine data for absent plugins) are printed only.
      - name: Validate the games' content (sage validate)
        run: |
          set -euo pipefail
          sage=src/Sage.Cli/bin/Development/net8.0/sage
          "$sage" validate games/Hello
          "$sage" validate games/Sandbox
          "$sage" validate tests/games/no-plugins
          "$sage" validate tests/games/scene-only
          "$sage" validate tests/games/camera-cut
          "$sage" validate tests/games/scripted-sequence
          "$sage" validate tests/games/topics
          "$sage" validate tests/games/skeletal

      # The JSON Schemas VS Code checks record files with (issue #21), regenerated from the code and the
      # loaded content (ids included) and compared with the committed schemas/: a new field, component,
      # part or record id means running this command and committing what it writes.
      - name: Check the committed JSON Schemas are current (sage schema)
        run: |
          set -euo pipefail
          src/Sage.Cli/bin/Development/net8.0/sage schema games/Sandbox games/Hello tests/games/scene-only tests/games/camera-cut tests/games/scripted-sequence tests/games/topics tests/games/skeletal --out schemas
          if ! git diff --exit-code --stat -- schemas || [ -n "$(git status --porcelain -- schemas)" ]; then
            git status --porcelain -- schemas
            git diff -- schemas | head -200
            echo "::error::schemas/ is stale: run 'sage schema games/Sandbox games/Hello tests/games/scene-only tests/games/camera-cut tests/games/scripted-sequence tests/games/topics tests/games/skeletal --out schemas' and commit the result"
            exit 1
          fi

      # The real executable, for a few seconds, under a virtual display (issue #6): it boots each game,
      # runs the loop and quits on its own, and fails on a crash, a non-zero exit, a missing shutdown or
      # any WARN/ERROR outside the allowed categories. Shaders are allowed because this job builds the
      # host without them (mgfxc needs Wine); Audio because a runner has no sound device.
      - name: Smoke-run the games (Development host, Xvfb)
        run: |
          set -euo pipefail
          host=src/Sage.Host/bin/Development/net8.0
          tools/smoke_run.sh "$host" games/Hello 3 Shaders
          tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # Several views a frame (issue #77): a split screen, then a top-down view into a render target the
          # HUD shows. Without shaders nothing is drawn but the clears, so this proves the path, not the picture.
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+r_testview 1\n+wait 1\n+r_testview 2\n+wait 1\n+r_stats' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # GPU skinning (issue #117): `r_testskin` generates a two-joint skinned column as a .glb, loads it
          # through the glTF skinned path and poses it every frame, then removes it. Without shaders no
          # material builds, so nothing is extracted or drawn here: this proves the generated model and the
          # loader. The Skinned technique compiles in the Windows job; the palette maths and extract are
          # the headless tests (SkinningTests).
          # anim_debug (issue #118) lists the animators, of which the Sandbox has none yet: the command runs.
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+r_testskin 1\n+wait 2\n+r_stats\n+anim_debug\n+r_testskin 0\n+wait 1' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # Third person (issue #79): ToggleView puts the player's camera over the shoulder, probing the
          # scenery every frame, and the renderer draws the body the first-person view hid.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_tap ToggleView\n+wait 5\n+in_tap ToggleView\n+wait 1' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # First-person arms (issue #121): equipping the practice sword puts its 3D arms on the player's camera,
          # holding the sword on their hand_r socket; R plays their reload and V hides them in third person and
          # back. The viewmodel pass is a depth-cleared view after the world; without shaders it draws only its
          # clear, so this proves the spawn, the graph, the attachment and the pass (ViewmodelTests the rest).
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+give practice_sword\n+equip practice_sword\n+wait 1\n+in_tap Reload\n+wait 1\n+anim_debug arms\n+r_stats\n+in_tap ToggleView\n+wait 1\n+in_tap ToggleView\n+wait 1' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # The editor's cameras (issue #81): `ed_viewport` draws the free camera, a camera entity, into the
          # render target `editor` that an ImGui window shows; `cam_free` puts it over the player's camera.
          # Then the Sandbox's scripted cut: the hut camera its path's wire turns on, for a second.
          SAGE_SMOKE_COMMANDS=$'+ed_viewport 1\n+wait 1\n+cam_free 1\n+wait 1\n+cam_free 0\n+ed_viewport 0\n+sv_cheats 1\n+ent_fire hut_cam CameraOn 1\n+wait 2' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # A widget screen (issue #97): the Sandbox's status screen opened by its key, walked with the
          # D-pad actions, closed with Back, then opened and closed from the console, fades and all.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_tap Status\n+wait 5\n+in_tap MenuDown\n+wait 2\n+in_tap MenuTab\n+wait 2\n+in_tap MenuBack\n+wait 5\n+ui_open status\n+wait 5\n+ui_close all' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # The RPG kit's screens from its own content (issue #98), drawn: the inventory grid (pick up,
          # move right, put down, Back), then the equipment screen, opened from the console.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+ui_open rpg:inventory\n+wait 3\n+in_tap MenuConfirm\n+wait 1\n+in_tap MenuRight\n+wait 1\n+in_tap MenuConfirm\n+wait 1\n+in_tap MenuBack\n+wait 3\n+ui_open rpg:equipment\n+wait 3\n+in_tap MenuDown\n+wait 1\n+ui_close all' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # The HUD, journal, map, main menu and shop on widgets (issue #99): the HUD is up from the start;
          # J and N open and close the journal and the map; a save is listed by the main menu (F10), and
          # Down then Confirm loads it and closes the menu; the shop shell opens from the console.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_tap Journal\n+wait 3\n+in_tap Journal\n+wait 2\n+in_tap Map\n+wait 3\n+in_tap MenuBack\n+wait 2\n+save smoke\n+wait 1\n+in_tap MainMenu\n+wait 3\n+in_tap MenuDown\n+wait 1\n+in_tap MenuConfirm\n+wait 3\n+ui_open rpg:shop\n+wait 3\n+ui_close' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # No plugins at all (issue #13). Records and Input are allowed because engine content still
          # ships every plugin's data in one folder, and says so when the plugin that reads it is absent.
          tools/smoke_run.sh "$host" tests/games/no-plugins 3 Shaders Audio Records Input
          # No C# at all, and a scene (issue #29): game.json and records boot into placed prefabs and a
          # player. Records for the same reason as above (it asks for the character plugin only).
          tools/smoke_run.sh "$host" tests/games/scene-only 3 Shaders Audio Records Input
          # A scripted camera cut with no C# (issue #80): a crate falls through a trigger wired in the
          # scene, and a placed camera takes the screen and gives it back. Records and Input as above.
          tools/smoke_run.sh "$host" tests/games/camera-cut 3 Shaders Audio Records Input
          # Phase 4b's exit (issue #94): a trigger, door, lift, NPC line, counter and relay chain, and a
          # conditional topic, both in data only. Same allowances as above.
          tools/smoke_run.sh "$host" tests/games/scripted-sequence 3 Shaders Audio Records Input
          tools/smoke_run.sh "$host" tests/games/topics 3 Shaders Audio Records Input
          # Phase 4d's exit (issue #122): box mannequins that walk, jog and run their lanes, and aim, strike
          # and reload, blended, in data only (a graph, prefabs, state machines sending tweens and params);
          # anim_debug lists their layers. Without shaders nothing is drawn: this proves the load, the
          # graph, the wires and the IK in the real host (NpcLocomotionTests the rest). Same allowances.
          SAGE_SMOKE_COMMANDS=$'+wait 3\n+anim_debug' \
            tools/smoke_run.sh "$host" tests/games/skeletal 4 Shaders Audio Records Input

      # Sage.Sdk (issue #32): the SDK, the Player (this job's host builds, so without shaders) and the
      # templates, packed into a local feed. Nothing is published: a public feed is REDESIGN §6 decision 7.
      - name: Pack the SDK, the Player and the templates (local feed)
        run: tools/pack_sdk.sh "$RUNNER_TEMP/sage-feed"

      # A game from each template, in a folder outside the checkout, so nothing of the repository's
      # Directory.Build.props, engine projects or tools can help: built against the packages alone, its
      # content validated (the mod against the game), the Sage analyzers shown to run (naming Friflo is
      # SAGE0050), and `dotnet run` started under Xvfb, walking for two seconds.
      - name: Template smoke test (outside the repository)
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/sage-feed"
          games="$RUNNER_TEMP/sage-games"
          dotnet new install "$feed"/Sage.Templates.*.nupkg
          dotnet new sage-game -n MyGame -o "$games/MyGame" --feed "$feed"
          dotnet new sage-game-data -n MyData -o "$games/MyData" --feed "$feed"
          dotnet new sage-mod-data -n MyMod -o "$games/MyMod" --game mygame
          ( cd "$games/MyGame" && dotnet build && dotnet msbuild -t:SageValidate -nologo )
          ( cd "$games/MyData" && dotnet build && dotnet msbuild -t:SageValidate -nologo )
          src/Sage.Cli/bin/Debug/net8.0/sage validate "$games/MyGame" --mounts "$games/MyMod=mymod"

          echo 'namespace MyGame; public sealed class Store { public Friflo.Engine.ECS.EntityStore? Inner; }' > "$games/MyGame/Simulation/Friflo.cs"
          if ( cd "$games/MyGame" && dotnet build > "$games/sage0050.log" 2>&1 ); then
            echo "::error::a game naming Friflo built: the Sage analyzers did not run"; exit 1
          fi
          grep -q "error SAGE0050" "$games/sage0050.log" || { cat "$games/sage0050.log"; exit 1; }
          rm "$games/MyGame/Simulation/Friflo.cs"

          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_axis Move 0 1 2' tools/smoke_run.sh --dotnet-run "$games/MyGame" 4 Shaders Audio
          tools/smoke_run.sh --dotnet-run "$games/MyData" 3 Shaders Audio Records Input

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            TestResults/*.trx
            user/registry.json
          if-no-files-found: ignore

  windows:
    name: Windows · full build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The whole history and its tags: the engine's version comes from them (MinVer, build/Sage.Version.props,
      # issue #31), and a shallow clone would version every build 0.1.0-alpha.0.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore local tools (mgfxc)
        run: dotnet tool restore

      - name: Build the solution (Debug)
        run: dotnet build Sage.sln -c Debug

      - name: Build the solution (Development)
        run: dotnet build Sage.sln -c Development

      - name: Build the solution (Shipping)
        run: dotnet build Sage.sln -c Shipping

      - name: Test (Debug)
        run: dotnet test tests/Sage.Tests/Sage.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=Debug.trx" --results-directory TestResults

      # The packed SDK where shaders compile (issue #32): a game from the template with a shader of its own
      # (the engine's debug.fx and the include it needs), built against the packages; Sage.Sdk restores
      # the game's mgfxc and writes the .mgfxo beside the .fx.
      - name: Pack the SDK, the Player and the templates (local feed)
        shell: bash
        run: tools/pack_sdk.sh "$(cygpath -m "$RUNNER_TEMP")/sage-feed"

      - name: Template build with a game shader (outside the repository)
        shell: bash
        run: |
          set -euo pipefail
          temp=$(cygpath -m "$RUNNER_TEMP")   # D:/a/_temp: a path both bash and dotnet read the same way
          feed="$temp/sage-feed"
          game="$temp/sage-games/MyGame"
          dotnet new install "$feed"/Sage.Templates.*.nupkg
          dotnet new sage-game -n MyGame -o "$game" --feed "$feed"
          mkdir -p "$game/content/shaders"
          cp engine_content/shaders/debug.fx engine_content/shaders/common.fxh "$game/content/shaders/"
          ( cd "$game" && dotnet build && dotnet msbuild -t:SageValidate -nologo )
          test -s "$game/content/shaders/debug.mgfxo"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/*.trx
          if-no-files-found: ignore
