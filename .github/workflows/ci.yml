# Continuous integration (docs/REDESIGN.md §4.8, issue #6).
#
#   linux    the whole solution (the host without shaders), the tests in Debug and Development on the .NET 8 runtime
#            the projects target, the docs checked against the registry dump (every name the host registered,
#            written by -dump-registry) with the real test count, each game's content through `sage validate`,
#            the committed JSON Schemas against a fresh `sage schema`, and the real executable run for a few
#            seconds on each game under Xvfb (tools/smoke_run.sh), and every RPG kit screen opened and its frame
#            compared with a golden (tools/kit_screens_check.sh, issue #355); then the SDK, the Player and the templates
#            packed into a local feed and a game made from each template outside the checkout: built against
#            the packages alone, validated, and run with `dotnet run` under Xvfb (issue #32); then packaged in
#            Shipping (`sage package`, issue #293) and run from the package's folder
#            Both jobs' builds check each engine assembly's declared public API (PublicAPI.*.txt, issue #31).
#   windows  the whole solution in all three configurations, shaders included, and the tests; then the
#            packed templates build a game with a shader of its own, which is where mgfxc runs, and package it;
#            the engine's compiled shaders are handed to the next job
#   drawing  the drawing checked (issue #318): the Linux host, given the shaders the Windows job compiled, draws
#            the render-check scene under Xvfb (Mesa's llvmpipe) and reads the frame back: the sky's colour, the
#            sun's shadow, the fog and the post grade are pixel checks (r_pixelcheck), so CI fails when one of
#            them stops drawing
#
# Only Windows compiles shaders, because mgfxc needs Wine on Linux (MGFXC0001): its OpenGL profile compiles HLSL
# with Direct3D's d3dcompiler_47 before translating it to GLSL, and DXC (which it runs natively) only serves the
# Vulkan and DirectX 12 profiles, whose shader model 6 the engine's SM3 effects are not. A Windows runner has no
# OpenGL beyond 1.1, so the host runs on Linux, with the .mgfxo files (GLSL, the same on every platform).
# The .NET 10 SDK builds; the .NET 8 runtime runs. Both matter: the 8.0.1xx SDK's compiler produced
# code the runtime rejected (InvalidProgramException in Assert.Fail), and only the .NET 8 runtime
# showed that every save was failing (SaveSystem's JsonSerializerOptions had no TypeInfoResolver).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux · tests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history and its tags: the engine's version comes from them (MinVer, build/Sage.Version.props,
      # issue #31), and a shallow clone would version every build 0.1.0-alpha.0.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The host is compiled without its shaders (SageSkipShaders): mgfxc needs Wine on Linux, and
      # the Windows job builds the real thing.
      - name: Build the solution (Debug, Development, Shipping; host without shaders)
        run: |
          set -euo pipefail
          for config in Debug Development Shipping; do
            echo "::group::$config"
            dotnet build Sage.sln -c "$config" -p:SageSkipShaders=true
            echo "::endgroup::"
          done

      # Not Shipping: it compiles out what some tests assert (README, "Building and testing").
      - name: Test (Debug)
        run: dotnet test tests/Sage.Tests/Sage.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=Debug.trx" --results-directory TestResults

      - name: Test (Development)
        run: dotnet test tests/Sage.Tests/Sage.Tests.csproj -c Development --no-build --logger "trx;LogFileName=Development.trx" --results-directory TestResults

      # Public API discipline (issue #31): the engine assemblies games and kits compile against declare their
      # public API in PublicAPI.Shipped.txt / Unshipped.txt, and the build above (every configuration, here
      # and on Windows) fails when code and files disagree. This shows it: a public type added to Sage.Core
      # without declaring it must be RS0016. (docs/RELEASING.md says how to update the files.)
      - name: An undeclared public API change is a build error (RS0016)
        run: |
          set -euo pipefail
          probe=src/Sage.Core/UndeclaredApiProbe.cs
          echo 'namespace Sage.Core; public sealed class UndeclaredApiProbe { public void Probe() { } }' > "$probe"
          if dotnet build src/Sage.Core/Sage.Core.csproj -c Debug --no-dependencies -p:SageSkipShaders=true > "$RUNNER_TEMP/rs0016.log" 2>&1; then
            rm "$probe"; echo "::error::a public type added without PublicAPI.Unshipped.txt built: the public API analyzer did not run"; exit 1
          fi
          rm "$probe"
          grep -q "error RS0016" "$RUNNER_TEMP/rs0016.log" || { cat "$RUNNER_TEMP/rs0016.log"; exit 1; }
          dotnet build src/Sage.Core/Sage.Core.csproj -c Debug --no-dependencies -p:SageSkipShaders=true > /dev/null

      # A virtual display, for the two steps that run the real executable.
      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      # Every command, cvar, record type, component, part, system, entity input/output and action the
      # Sandbox registers, with owners and fields (RegistryDump, issue #18). The host boots, writes it and
      # quits; check_docs.py reads names and counts from it instead of scanning the source.
      - name: Dump the registry (Development host, Xvfb)
        run: |
          set -euo pipefail
          ( cd src/Sage.Host/bin/Development/net8.0 && timeout 120 xvfb-run -a -s "-screen 0 1024x768x24" \
              ./Sage.Host -game "$GITHUB_WORKSPACE/games/Sandbox" -dump-registry "$GITHUB_WORKSPACE/user/registry.json" > /dev/null )
          test -s user/registry.json

      - name: Check the docs against the code (R19)
        run: |
          set -euo pipefail
          count=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
          counters = ET.parse("TestResults/Debug.trx").getroot().find(f".//{ns}Counters")
          print(counters.get("total"))
          EOF
          )
          echo "dotnet test reported $count tests"
          python3 tools/check_docs.py --self-test
          python3 -m unittest discover -s tools -p 'test_*.py'   # the checker's own tests (issue #298)
          # Docs are updated once per merged pack of issues, not in each issue's PR (owner, 2026-10-02):
          # an issue PR's quoted counts may be stale, so they are fixed in this checkout only and listed;
          # links, test citations and vocabulary still fail. A docs PR (a branch with "docs" in its name)
          # is held to the counts too.
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$branch" == *docs* ]]; then
            python3 tools/check_docs.py --tests "$count" --registry user/registry.json
          else
            python3 tools/check_docs.py --tests "$count" --registry user/registry.json --fix
            git diff --stat -- '*.md' | sed 's/^/stale count (the next docs PR fixes it): /' || true
          fi

      # `sage validate` (issue #22): each game's content, headless, with every check the load makes —
      # references by type, prefab bodies, asset paths, AI schedules — and missing assets as errors.
      # Fails on any error; warnings (the test games' engine data for absent plugins) are printed only.
      - name: Validate the games' content (sage validate)
        run: |
          set -euo pipefail
          sage=src/Sage.Cli/bin/Development/net8.0/sage
          "$sage" validate games/Hello
          "$sage" validate games/Sandbox
          "$sage" validate tests/games/no-plugins
          "$sage" validate tests/games/scene-only
          "$sage" validate tests/games/camera-cut
          "$sage" validate tests/games/scripted-sequence
          "$sage" validate tests/games/topics
          "$sage" validate tests/games/skeletal
          "$sage" validate tests/games/weapons
          "$sage" validate tests/games/saves
          "$sage" validate tests/games/saves --mounts tests/games/saves/rebalance=rebalance
          "$sage" validate tests/games/open-world
          # Phase 4j's exit (issue #200): the village alone, then with the two mods in its own mods/ folder,
          # and `sage mods` (the load order and the conflict report; exits 1 on a refused mod or an error,
          # a conflict is a warning).
          "$sage" validate tests/games/mods
          "$sage" validate tests/games/mods --game-mods
          "$sage" mods tests/games/mods
          # Phase 10a's exit (issue #228): the editor's test game, an empty level and four prefabs.
          "$sage" validate tests/games/editor
          # The render check's scene (issue #318): a `.map` yard, a sky and a placed camera, no C#.
          "$sage" validate tests/games/render-check
          # The kit screens check's game (issue #355): a player, a trader, a chest, a ferryman and a quest, no C#.
          "$sage" validate tests/games/kit-screens

      # The JSON Schemas VS Code checks record files with (issue #21), regenerated from the code and the
      # loaded content (ids included) and compared with the committed schemas/: a new field, component,
      # part or record id means running this command and committing what it writes.
      - name: Check the committed JSON Schemas are current (sage schema)
        run: |
          set -euo pipefail
          src/Sage.Cli/bin/Development/net8.0/sage schema games/Sandbox games/Hello tests/games/scene-only tests/games/camera-cut tests/games/scripted-sequence tests/games/topics tests/games/skeletal tests/games/weapons tests/games/saves tests/games/open-world tests/games/mods tests/games/editor tests/games/render-check tests/games/kit-screens --out schemas
          if ! git diff --exit-code --stat -- schemas || [ -n "$(git status --porcelain -- schemas)" ]; then
            git status --porcelain -- schemas
            git diff -- schemas | head -200
            echo "::error::schemas/ is stale: run 'sage schema games/Sandbox games/Hello tests/games/scene-only tests/games/camera-cut tests/games/scripted-sequence tests/games/topics tests/games/skeletal tests/games/weapons tests/games/saves tests/games/open-world tests/games/mods tests/games/editor tests/games/render-check tests/games/kit-screens --out schemas' and commit the result"
            exit 1
          fi

      # The real executable, for a few seconds, under a virtual display (issue #6): it boots each game,
      # runs the loop and quits on its own, and fails on a crash, a non-zero exit, a missing shutdown or
      # any WARN/ERROR outside the allowed categories. Shaders are allowed because this job builds the
      # host without them (mgfxc needs Wine); Audio because a runner has no sound device.
      - name: Smoke-run the games (Development host, Xvfb)
        run: |
          set -euo pipefail
          host=src/Sage.Host/bin/Development/net8.0
          tools/smoke_run.sh "$host" games/Hello 3 Shaders
          tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # Phase 4h's exit (issue 4h-7): the Sandbox opens at dusk under its sky with sun shadows on (its
          # own default); post-processing at half scale, the clock run through sunset into the night (the
          # lamps come on: r_stats' lights), a storm rolled in over the dusk, then 22:00; r_passes lists the
          # shadow, sky and post passes. Without shaders no material builds, so nothing casts and the sky
          # and post steps fall back to their clears and plain copies: this proves the passes, targets, cvars,
          # clock and weather in the real host, and the catch-up frames under llvmpipe with post on. The
          # maths is DuskToNightExitTests; the shaders compile in the Windows job.
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+r_post 1\n+r_scale 0.5\n+wait 1\n+r_stats\n+time_set 19:20\n+time_scale 3600\n+wait 2\n+time\n+r_stats\n+r_passes\n+weather rain 1\n+wait 1\n+time_set 22\n+wait 1\n+r_stats' \
            tools/smoke_run.sh "$host" games/Sandbox 6 Shaders Audio
          # HDR, bloom, anti-aliasing and the depth hook (issue #316): the Sandbox with r_post, a half-float scene,
          # the bloom chain, FXAA and its depth haze (a post effect that reads the scene's depth, so sage:depth is
          # drawn), then 4x MSAA at half scale. Without shaders the steps fall back to plain copies and the
          # depth pass to its clear: this proves the targets (HdrBlendable, multisampled, R32F), the plan and
          # the cvars in the real host. The curves and the plan are PostHdrTests; post.fx and depth_haze.fx
          # compile in the Windows job.
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+r_post 1\n+r_hdr 1\n+r_bloom 1\n+r_aa fxaa\n+wait 1\n+r_stats\n+wait 1\n+r_aa msaa4\n+r_scale 0.5\n+wait 1\n+r_post_haze 0\n+r_hdr 0\n+wait 1' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # Several views a frame (issue #77): a split screen, then a top-down view into a render target the
          # HUD shows. Without shaders nothing is drawn but the clears, so this proves the path, not the picture.
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+r_testview 1\n+wait 1\n+r_testview 2\n+wait 1\n+r_stats' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # GPU skinning (issue #117): `r_testskin` generates a two-joint skinned column as a .glb, loads it
          # through the glTF skinned path and poses it every frame, then removes it. Without shaders no
          # material builds, so nothing is extracted or drawn here: this proves the generated model and the
          # loader. The Skinned technique compiles in the Windows job; the palette maths and extract are
          # the headless tests (SkinningTests).
          # anim_debug (issue #118) lists the animators: the Sandbox's creatures, whose sprites a graph plays (#119).
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+r_testskin 1\n+wait 2\n+r_stats\n+anim_debug\n+r_testskin 0\n+wait 1' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # Third person (issue #79): ToggleView puts the player's camera over the shoulder, probing the
          # scenery every frame, and the renderer draws the body the first-person view hid.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_tap ToggleView\n+wait 5\n+in_tap ToggleView\n+wait 1' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # First-person arms (issue #121): equipping the practice sword puts its 3D arms on the player's camera,
          # holding the sword on their hand_r socket; R plays their reload and V hides them in third person and
          # back. The viewmodel pass is a depth-cleared view after the world; without shaders it draws only its
          # clear, so this proves the spawn, the graph, the attachment and the pass (ViewmodelTests the rest).
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+give practice_sword\n+equip practice_sword\n+wait 1\n+in_tap Reload\n+wait 1\n+anim_debug arms\n+r_stats\n+in_tap ToggleView\n+wait 1\n+in_tap ToggleView\n+wait 1' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # The editor's cameras (issue #81): `ed_viewport` draws the free camera, a camera entity, into the
          # render target `editor` that an ImGui window shows; `cam_free` puts it over the player's camera.
          # Then the Sandbox's scripted cut: the hut camera its path's wire turns on, for a second.
          SAGE_SMOKE_COMMANDS=$'+ed_viewport 1\n+wait 1\n+cam_free 1\n+wait 1\n+cam_free 0\n+ed_viewport 0\n+sv_cheats 1\n+ent_fire hut_cam CameraOn 1\n+wait 2' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # The editor mode (issue #219): `-edit yard` boots the Sandbox into an edit world (its start scene,
          # nothing simulated, no player) with the `yard` placements document open, the docked layout, the free
          # camera on the screen flying on the Editor context's EditorMove, a crate selected for the inspector
          # and the status bar, the layout reset and the viewport window on. EditModeTests has the edit world.
          # Then it is moved, turned, framed, duplicated, the copy deleted and all undone (#221, ViewportToolsTests).
          SAGE_SMOKE_ARGS='-edit yard' SAGE_SMOKE_COMMANDS=$'+wait 1\n+doc_status\n+ent_select crate by the door\n+ed_select crate by the door\n+ed_move 3 0 2\n+ed_rotate 45\n+ed_frame\n+ed_duplicate\n+wait 1\n+ed_delete\n+ed_undo 4\n+in_axis EditorMove 0 1 1\n+wait 1\n+ed_layout\n+ed_viewport 1\n+wait 1\n+in_contexts' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # The Sandbox's skeletal creature (issue #362): the brute in the clearing is the mannequin on its
          # `brute` graph, guarding and swinging on its upper layer; anim_debug must find it posed (18 joints).
          SAGE_SMOKE_EXPECT=$'brute \\([0-9]+\\): graph sandbox:brute, model models/mannequin.glb, pose of 18 joints\n  upper: (none|guard|attack)' \
          SAGE_SMOKE_COMMANDS=$'+wait 3\n+anim_debug brute' \
            tools/smoke_run.sh "$host" games/Sandbox 4 Shaders Audio
          # The editor's animation preview (issue #362): `anim_preview brute` opens the brute's graph on its model
          # in the Animation panel, its params and a trigger drive it (the strike's `hit` is raised), a clip is
          # scrubbed to its marker, and the panel draws both for a second. AnimationPreviewTests has the rest.
          SAGE_SMOKE_ARGS='-edit yard' \
          SAGE_SMOKE_EXPECT=$'anim_preview: graph sandbox:brute on models/mannequin.glb, 18 joints, 10 clip\\(s\\)\nanim_preview: t=[0-9.]+s, events: .*hit@\nanim_preview: clip attack at 0.40/0.80s, 18 joints, 3 socket\\(s\\) \\| hit@0.40s' \
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+anim_preview brute\n+anim_preview_param guard 1\n+anim_preview_param attack\n+anim_preview_step 1\n+wait 1\n+anim_preview_clip attack 0.4\n+wait 1\n+anim_preview_clip\n+anim_preview_param speed 3\n+wait 1\n+anim_preview_close' \
            tools/smoke_run.sh "$host" games/Sandbox 5 Shaders Audio
          # A widget screen (issue #97): the Sandbox's status screen opened by its key, walked with the
          # D-pad actions, closed with Back, then opened and closed from the console, fades and all.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_tap Status\n+wait 5\n+in_tap MenuDown\n+wait 2\n+in_tap MenuTab\n+wait 2\n+in_tap MenuBack\n+wait 5\n+ui_open status\n+wait 5\n+ui_close all' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # The RPG kit's screens from its own content (issue #98), drawn: the inventory grid (pick up,
          # move right, put down, Back), then the equipment screen, opened from the console.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+ui_open rpg:inventory\n+wait 3\n+in_tap MenuConfirm\n+wait 1\n+in_tap MenuRight\n+wait 1\n+in_tap MenuConfirm\n+wait 1\n+in_tap MenuBack\n+wait 3\n+ui_open rpg:equipment\n+wait 3\n+in_tap MenuDown\n+wait 1\n+ui_close all' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # The mouse is held while the player looks around and let go for a screen (issue #334): the Sandbox's
          # status screen opened and closed leaves captured, released (screen open), captured in the log, in order.
          SAGE_SMOKE_EXPECT=$'Mouse captured\nMouse released \\(screen open\\)\nMouse captured' \
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+ui_open status\n+wait 3\n+ui_close all\n+wait 3' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # The HUD, journal, map, main menu and shop on widgets (issue #99): the HUD is up from the start;
          # J and N open and close the journal and the map; a save is listed by the main menu (F10), and
          # Down then Confirm loads it and closes the menu; the shop shell opens from the console.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_tap Journal\n+wait 3\n+in_tap Journal\n+wait 2\n+in_tap Map\n+wait 3\n+in_tap MenuBack\n+wait 2\n+save smoke\n+wait 1\n+in_tap MainMenu\n+wait 3\n+in_tap MenuDown\n+wait 1\n+in_tap MenuConfirm\n+wait 3\n+ui_open rpg:shop\n+wait 3\n+ui_close' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # The open world in the Sandbox (issue 4g-7): T opens the RPG kit's rest screen by the watcher (sleep
          # refused, the slider moved); the crypt door's Travel input goes into the interior, lit by its three
          # torches alone (r_stats: lights 3, skies 0); the rest screen from the console and `rest 8` there;
          # the way out back to the hill at night (the lamps lit); the map with its waystone; `travel` lists it.
          SAGE_SMOKE_COMMANDS=$'+sv_cheats 1\n+wait 1\n+in_tap Rest\n+wait 3\n+in_tap MenuRight\n+wait 1\n+in_tap MenuConfirm\n+wait 1\n+in_tap MenuBack\n+wait 2\n+ent_fire crypt_door Travel\n+wait 2\n+r_stats\n+ui_open rpg:rest\n+wait 2\n+rest 8\n+wait 2\n+ui_close all\n+ent_fire crypt_exit Travel\n+wait 2\n+r_stats\n+in_tap Map\n+wait 3\n+in_tap MenuBack\n+wait 1\n+travel' \
            tools/smoke_run.sh "$host" games/Sandbox 8 Shaders Audio
          # The mods screen (issue 4j-6): opened from the console (the F10 menu's Mods button opens the same screen),
          # walked with the menu actions, tabbed to the conflicts and closed; the Sandbox has no mods, so it lists none.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+ui_open rpg:mods\n+wait 3\n+in_tap MenuDown\n+wait 1\n+in_tap MenuRight\n+wait 1\n+in_tap MenuConfirm\n+wait 2\n+in_tap MenuBack\n+wait 2\n+ui_close all' \
            tools/smoke_run.sh "$host" games/Sandbox 3 Shaders Audio
          # No plugins at all (issue #13). Records and Input are allowed because engine content still
          # ships every plugin's data in one folder, and says so when the plugin that reads it is absent.
          tools/smoke_run.sh "$host" tests/games/no-plugins 3 Shaders Audio Records Input
          # No C# at all, and a scene (issue #29): game.json and records boot into placed prefabs and a
          # player. Records for the same reason as above (it asks for the character plugin only).
          tools/smoke_run.sh "$host" tests/games/scene-only 3 Shaders Audio Records Input
          # A scripted camera cut with no C# (issue #80): a crate falls through a trigger wired in the
          # scene, and a placed camera takes the screen and gives it back. Records and Input as above.
          tools/smoke_run.sh "$host" tests/games/camera-cut 3 Shaders Audio Records Input
          # Phase 4b's exit (issue #94): a trigger, door, lift, NPC line, counter and relay chain, and a
          # conditional topic, both in data only. Same allowances as above.
          tools/smoke_run.sh "$host" tests/games/scripted-sequence 3 Shaders Audio Records Input
          tools/smoke_run.sh "$host" tests/games/topics 3 Shaders Audio Records Input
          # Phase 4d's exit (issue #122): box mannequins that walk, jog and run their lanes, and aim, strike
          # and reload, blended, in data only (a graph, prefabs, state machines sending tweens and params);
          # anim_debug lists their layers. Without shaders nothing is drawn: this proves the load, the
          # graph, the wires and the IK in the real host (NpcLocomotionTests the rest). Same allowances.
          # Phase 4k's exit (issue #249): nine seconds, so the tumbler is knocked over on its wire at 3 s,
          # settles and is getting up by the second anim_debug, and the casualty is killed at 2 s and stays down
          # (RagdollExitTests the rest).
          SAGE_SMOKE_COMMANDS=$'+wait 3\n+anim_debug\n+wait 5\n+anim_debug' \
            tools/smoke_run.sh "$host" tests/games/skeletal 9 Shaders Audio Records Input
          # Phase 4e's exit (issue #139): a range where a sword, a crossbow, a pistol and a fireball, all records,
          # hit armoured dummies on the one hit pipeline. Same allowances as above.
          tools/smoke_run.sh "$host" tests/games/weapons 3 Shaders Audio Records Input
          # Phase 4i's exit (issue #167): placed goblins, a map's ring and tally, a dropped item and an arrow
          # to save and load (SavesExitTests plays it headlessly). Same allowances as above.
          tools/smoke_run.sh "$host" tests/games/saves 3 Shaders Audio Records Input
          # Phase 4g's exit (issue #190): a streamed valley on the built-in hills, a smith on a routine, guards
          # and bandits off-screen, and a `.map` crypt behind a load door (OpenWorldExitTests plays it
          # headlessly). Into the crypt by the Travel input, 26 hours pass, out again, and the off-screen
          # table listed. Same allowances as above.
          SAGE_SMOKE_COMMANDS=$'+wait 2\n+sv_cheats 1\n+ent_fire player Travel "crypt crypt_in"\n+wait 2\n+time_pass 26\n+wait 1\n+ent_fire way_out Travel\n+wait 2\n+offscreen_status' \
            tools/smoke_run.sh "$host" tests/games/open-world 4 Shaders Audio Records Input
          # Phase 4j's exit (issue #200): a village whose two data mods the host finds in its mods/ folder and
          # mounts after it; mod_list and mod_conflicts print the order and the report (ModsExitTests plays it
          # headlessly). Same allowances as above.
          SAGE_SMOKE_COMMANDS=$'+wait 1\n+mod_list\n+mod_conflicts\n+ui_open rpg:shop\n+wait 2\n+ui_close all' \
            tools/smoke_run.sh "$host" tests/games/mods 3 Shaders Audio Records Input
          # Phase 10a's exit (issue #228): the editor on its test game, `-edit level` (an empty level). The plate
          # and the door placed, the door's speed overridden, the plate wired to it, two steps undone and
          # redone, a second of play and back, and the problems listed. Nothing is saved here, so the repository
          # stays as it was; EditorExitTests saves, and boots what it saved. Same allowances as above.
          SAGE_SMOKE_ARGS='-edit level' SAGE_SMOKE_COMMANDS=$'+wait 1\n+doc_status\n+ed_palette\n+ed_place plate 0 0.5 2 0 plate\n+ed_place door 0 1.5 -4 180 door\n+ed_set door mover.seconds 0.5\n+ed_wire plate OnStartTouch door Open\n+ed_undo 2\n+ed_redo 2\n+ed_history\n+wait 1\n+ed_play\n+wait 2\n+ed_stop\n+wait 1\n+ed_problems\n+doc_status' \
            tools/smoke_run.sh "$host" tests/games/editor 5 Shaders Audio Records Input
          # The render check (issue #318): its fixed scene drawn, read back and checked by r_pixelcheck. Without
          # shaders every view is its clear colour, so only the checks of that run here; the drawing job runs the
          # rest with the Windows job's shaders. This proves the readback, the regions and the specs in the host.
          SAGE_SMOKE_COMMANDS=$'+vid_width 640\n+vid_height 360\n+sv_cheats 1\n+time_scale 0\n+r_shadows 1\n+wait 2\n+r_pixelcheck checks/drawing.json\n+wait\n+r_post 1\n+r_post_vignette 0\n+wait 1\n+r_pixelcheck checks/post.json\n+wait 1' \
            tools/smoke_run.sh "$host" tests/games/render-check 5 Shaders Audio Records Input

      # Every RPG kit screen drawn by the real client (issue #355): tests/games/kit-screens/screens.txt, each opened
      # over the kit-screens game at 960x540 and its frame compared, a grid of cell colours, with its golden in
      # goldens/frame (r_framecheck, FrameGrid). A screen that draws differently is an ERROR, so the run fails; the
      # frames, and the grid of each that failed (the new golden, if the change is meant), are uploaded. Taken
      # without shaders, as this job's host is built: the world behind each screen is its clear colour.
      # KitScreenGoldenTests checks the same screens' render plans headlessly, in the tests above.
      - name: Check the kit screens' drawing (Development host, Xvfb)
        run: tools/kit_screens_check.sh src/Sage.Host/bin/Development/net8.0

      - name: Upload the kit screens' frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-screens
          path: |
            user/kitscreens/screenshots/framecheck-*
            user/kitscreens/logs/*.log
          if-no-files-found: ignore

      # Sage.Sdk (issue #32): the SDK, the Player (this job's host builds, so without shaders) and the
      # templates, packed into a local feed. Nothing is published: a public feed is REDESIGN §6 decision 7.
      - name: Pack the SDK, the Player and the templates (local feed)
        run: tools/pack_sdk.sh "$RUNNER_TEMP/sage-feed"

      # A game from each template, in a folder outside the checkout, so nothing of the repository's
      # Directory.Build.props, engine projects or tools can help: built against the packages alone, its
      # content validated (the mod against the game), the Sage analyzers shown to run (naming Friflo is
      # SAGE0050), and `dotnet run` started under Xvfb, walking for two seconds.
      - name: Template smoke test (outside the repository)
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/sage-feed"
          games="$RUNNER_TEMP/sage-games"
          dotnet new install "$feed"/Sage.Templates.*.nupkg
          dotnet new sage-game -n MyGame -o "$games/MyGame" --feed "$feed"
          dotnet new sage-game-data -n MyData -o "$games/MyData" --feed "$feed"
          ( cd "$games/MyGame" && dotnet build && dotnet msbuild -t:SageValidate -nologo )
          ( cd "$games/MyData" && dotnet build && dotnet msbuild -t:SageValidate -nologo )
          sage=src/Sage.Cli/bin/Debug/net8.0/sage
          # `sage new` (issue #297): the mod made for the built game, so its schemas are written into it (what its
          # .vscode/settings.json maps data/ and mod.json onto) and it is validated against the game; then a client
          # half added to the data-only game in its Client/ folder, game.json made to load it, and built.
          $sage new mod-data -n MyMod -o "$games/MyMod" --game "$games/MyGame"
          test -s "$games/MyMod/schemas/record.schema.json" && test -s "$games/MyMod/schemas/mod.schema.json"
          grep -q '"game": "mygame"' "$games/MyMod/mod.json" || { echo "::error::sage new mod-data did not name the game"; exit 1; }
          $sage new game-client --game "$games/MyData"
          grep -q 'Client/bin/{config}/MyData.Client.dll' "$games/MyData/game.json" || { echo "::error::game.json does not load the client half"; exit 1; }
          ( cd "$games/MyData/Client" && dotnet build && dotnet msbuild -t:SageValidate -nologo )
          # The mod through its mod.json (phase 4j): validated with the game, and `sage mods` lists the order
          # and the report and exits 1 on a refused mod or a content error. Then the mod put where a game
          # finds its mods, and the game's own mods folder checked the same way.
          $sage validate "$games/MyGame" --mods "$games/MyMod"
          $sage mods "$games/MyGame" --mods "$games/MyMod" | tee "$games/mods.log"
          grep -q "1 mod(s) active, 0 refused" "$games/mods.log" || { echo "::error::the template mod was not loaded"; exit 1; }
          grep -q "added item: mymod:falchion" "$games/mods.log" || { echo "::error::the template mod's weapon was not added"; exit 1; }
          mkdir -p "$games/MyGame/mods" && cp -r "$games/MyMod" "$games/MyGame/mods/mymod"
          $sage mods "$games/MyGame"
          $sage validate "$games/MyGame" --game-mods
          rm -r "$games/MyGame/mods"
          # A mod.json key the loader does not know is an error here too, not a surprise at boot.
          cp "$games/MyMod/mod.json" "$games/mod.json.bak" && sed -i 's/"loadAfter"/"loadafter_typo"/' "$games/MyMod/mod.json"
          if $sage mods "$games/MyGame" --mods "$games/MyMod"; then echo "::error::a mod.json with an unknown key loaded"; exit 1; fi
          mv "$games/mod.json.bak" "$games/MyMod/mod.json"

          echo 'namespace MyGame; public sealed class Store { public Friflo.Engine.ECS.EntityStore? Inner; }' > "$games/MyGame/Simulation/Friflo.cs"
          if ( cd "$games/MyGame" && dotnet build > "$games/sage0050.log" 2>&1 ); then
            echo "::error::a game naming Friflo built: the Sage analyzers did not run"; exit 1
          fi
          grep -q "error SAGE0050" "$games/sage0050.log" || { cat "$games/sage0050.log"; exit 1; }
          rm "$games/MyGame/Simulation/Friflo.cs"

          SAGE_SMOKE_COMMANDS=$'+wait 1\n+in_axis Move 0 1 2' tools/smoke_run.sh --dotnet-run "$games/MyGame" 4 Shaders Audio
          # The data-only game with its client half, through `sage run` (issue #297): `dotnet run` on Client/, which
          # builds the game's own project too and starts the host on the game folder, the client half loaded.
          tools/smoke_run.sh --sage-run "$games/MyData" 3 Shaders Audio Records Input

      # `sage package` (issue #293): the template game built in Shipping and packaged by the SDK's SagePackage
      # target, which runs the Player's own `sage package` on its Shipping host: the host, the game beside it in
      # game/ and nothing of the developer's (no sage CLI, editor or ImGui), validated where it was written. Then
      # the folder is run as a player would, its Sage.Host with no -game, for a few seconds under Xvfb. A Shipping
      # host has no developer commands (in_axis, host_exitafter are DevOnly), so the run boots, plays and quits
      # on +quit; the walk is the step above's, in the Debug host.
      - name: Package a template game and run the package (Shipping)
        run: |
          set -euo pipefail
          game="$RUNNER_TEMP/sage-games/MyGame"
          out="$RUNNER_TEMP/sage-package/MyGame"
          ( cd "$game" && dotnet build -c Shipping && dotnet msbuild -t:SagePackage -p:Configuration=Shipping -p:SagePackageDirectory="$out" -nologo )
          dev=$(find "$out" -iname 'Sage.Editor*' -o -iname 'Sage.Editing*' -o -iname '*imgui*' -o -iname 'sage.dll' -o -iname '*.csproj' -o -iname '*.cs')
          if [ -n "$dev" ]; then echo "::error::the package has developer files in it: $dev"; exit 1; fi
          test -x "$out/Sage.Host" && test -s "$out/game/game.json" && test -s "$out/game/bin/MyGame.dll" && test -s "$out/game/bin/MyGame.Client.dll"
          tools/smoke_run.sh --packaged "$out" 4 Shaders Audio

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            TestResults/*.trx
            user/registry.json
          if-no-files-found: ignore

  windows:
    name: Windows · full build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The whole history and its tags: the engine's version comes from them (MinVer, build/Sage.Version.props,
      # issue #31), and a shallow clone would version every build 0.1.0-alpha.0.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore local tools (mgfxc)
        run: dotnet tool restore

      - name: Build the solution (Debug)
        run: dotnet build Sage.sln -c Debug

      - name: Build the solution (Development)
        run: dotnet build Sage.sln -c Development

      # The engine's effects as mgfxc compiled them for OpenGL (GLSL inside, the same on every platform): the
      # drawing job runs the Linux host on them, since this runner cannot run the host (issue #318).
      - name: Hand the compiled shaders to the drawing job
        uses: actions/upload-artifact@v4
        with:
          name: engine-shaders
          path: src/Sage.Host/bin/Development/net8.0/Content/shaders/*.mgfxo
          if-no-files-found: error
          retention-days: 7

      - name: Build the solution (Shipping)
        run: dotnet build Sage.sln -c Shipping

      - name: Test (Debug)
        run: dotnet test tests/Sage.Tests/Sage.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=Debug.trx" --results-directory TestResults

      # The packed SDK where shaders compile (issue #32): a game from the template with a shader of its own
      # (the engine's debug.fx and the include it needs), built against the packages; Sage.Sdk restores
      # the game's mgfxc and writes the .mgfxo beside the .fx.
      - name: Pack the SDK, the Player and the templates (local feed)
        shell: bash
        run: tools/pack_sdk.sh "$(cygpath -m "$RUNNER_TEMP")/sage-feed"

      - name: Template build with a game shader (outside the repository)
        shell: bash
        run: |
          set -euo pipefail
          temp=$(cygpath -m "$RUNNER_TEMP")   # D:/a/_temp: a path both bash and dotnet read the same way
          feed="$temp/sage-feed"
          game="$temp/sage-games/MyGame"
          dotnet new install "$feed"/Sage.Templates.*.nupkg
          dotnet new sage-game -n MyGame -o "$game" --feed "$feed"
          mkdir -p "$game/content/shaders"
          cp engine_content/shaders/debug.fx engine_content/shaders/common.fxh "$game/content/shaders/"
          ( cd "$game" && dotnet build && dotnet msbuild -t:SageValidate -nologo )
          test -s "$game/content/shaders/debug.mgfxo"

      # `sage package` (issue #293) where the host has its shaders: the same game built in Shipping and packaged
      # by SagePackage (which validates the folder, compiled shaders and all), and the folder checked for the
      # executable, the game's shader and no developer files. The Linux job runs its package; a Windows runner
      # has no OpenGL beyond 1.1, which is why no job here runs the host.
      - name: Package the template game (Shipping)
        shell: bash
        run: |
          set -euo pipefail
          temp=$(cygpath -m "$RUNNER_TEMP")
          game="$temp/sage-games/MyGame"
          out="$temp/sage-package/MyGame"
          ( cd "$game" && dotnet build -c Shipping && dotnet msbuild -t:SagePackage -p:Configuration=Shipping -p:SagePackageDirectory="$out" -nologo )
          dev=$(find "$out" -iname 'Sage.Editor*' -o -iname 'Sage.Editing*' -o -iname '*imgui*' -o -iname 'sage.dll' -o -iname '*.csproj' -o -iname '*.cs')
          if [ -n "$dev" ]; then echo "::error::the package has developer files in it: $dev"; exit 1; fi
          test -s "$out/Sage.Host.exe" && test -s "$out/game/game.json" && test -s "$out/game/bin/MyGame.dll"
          test -s "$out/game/content/shaders/debug.mgfxo" && test -s "$out/Content/shaders/lit.mgfxo"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/*.trx
          if-no-files-found: ignore

  # The drawing checked (issue #318). The Windows job compiles the shaders and cannot run the host; this job builds
  # the host on Linux (without shaders, as the Linux job does), puts the Windows job's .mgfxo files where the
  # build would have, and runs the render-check scene under Xvfb on Mesa's llvmpipe: noon under a blue sky,
  # a floating slab shading a white ground, orange fog in the distance. `r_pixelcheck <spec> shaders` reads the
  # frame back and checks named regions against tests/games/render-check/content/checks/*.json (PixelCheck,
  # headless; RenderCheckSceneTests proves what each region looks at): the sky pass's colour, the shadow darker
  # than the sunlit ground beside it, the far ground the fog's colour, and with `r_post 1` the scene's grey grade.
  # A failed check is an ERROR, so the smoke run fails; `shaders` makes missing shaders an error rather than a
  # skip, and Shaders is not an allowed category here: every effect must load. The frames are uploaded.
  drawing:
    name: Linux · drawing checks (Windows-compiled shaders)
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the host (Development, without shaders)
        run: dotnet build src/Sage.Host/Sage.Host.csproj -c Development -p:SageSkipShaders=true

      - name: Take the shaders the Windows job compiled
        uses: actions/download-artifact@v4
        with:
          name: engine-shaders
          path: src/Sage.Host/bin/Development/net8.0/Content/shaders

      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      # A gap in a shader's packed constants shifts every one after it on OpenGL (#481).
      - name: Check the OpenGL shaders' constants
        run: python3 tools/check_glsl_constants.py src/Sage.Host/bin/Development/net8.0/Content/shaders

      - name: Draw the render check and check its pixels (Development host, Xvfb)
        run: |
          set -euo pipefail
          ls -l src/Sage.Host/bin/Development/net8.0/Content/shaders
          test -s src/Sage.Host/bin/Development/net8.0/Content/shaders/lit.mgfxo
          # 640x360, the specs' frame; the clock stopped at the scene's noon; sun shadows on (off by default).
          # Then post-processing on with the vignette off, so the scene's grey grade is the visible step.
          SAGE_SMOKE_COMMANDS=$'+vid_width 640\n+vid_height 360\n+sv_cheats 1\n+time_scale 0\n+r_shadows 1\n+wait 3\n+r_pixelcheck checks/drawing.json shaders\n+wait\n+r_post 1\n+r_post_vignette 0\n+wait 2\n+r_pixelcheck checks/post.json shaders\n+wait 1' \
            tools/smoke_run.sh src/Sage.Host/bin/Development/net8.0 tests/games/render-check 8 Audio Records Input
          log=$(ls -t user/rendercheck/logs/sage-*.log | head -1)
          grep "Pixel check" "$log" | sed 's/^.*Render    //'
          # Both specs ran, with shaders: a run that never reached them must not pass.
          test "$(grep -c 'Pixel check checks/.* with shaders: .* 0 failed' "$log")" -eq 2

      - name: Upload the frames and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-checks
          path: |
            user/rendercheck/screenshots/*.png
            user/rendercheck/logs/*.log
          if-no-files-found: ignore
